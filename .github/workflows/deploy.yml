name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install -g wrangler@latest
      - name: Create Pages Project if not exists
        run: wrangler pages project create bumatech-site --production-branch main 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3a21160f8129aba38af5fb0cae3da25f
      - name: Deploy to Cloudflare Pages
        run: wrangler pages deploy . --project-name=bumatech-site --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3a21160f8129aba38af5fb0cae3da25f
      - name: Add Custom Domain buma-tech.com
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/3a21160f8129aba38af5fb0cae3da25f/pages/projects/bumatech-site/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"buma-tech.com"}' | cat || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
